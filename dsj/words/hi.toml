# Hindi words `dsj hatao` mutes by default (#64).
#
# Hand-written in this repo, the same words as ur.toml (spoken Hindi and Urdu
# share them) with their Devanagari forms under `script`. ur.toml is loaded
# first, so a Roman spelling found in both is reported as ur's. Spellings with
# a nukta or a chandrabindu are listed both ways (ड़ and ड, ँ and ं), because a
# recogniser writes either. Add your own words to your user file
# (`dsj hatao --help` names it), never here: an update replaces this file.

[[entry]]
name = "madarchod"
roman = ["madarchod", "maderchod", "madarchood", "madharchod", "maadarchod", "madar chod"]
script = ["मादरचोद", "मादरचोत", "मादर चोद"]

