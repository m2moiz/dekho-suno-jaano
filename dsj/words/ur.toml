# Urdu words `dsj hatao` mutes by default (#64).
#
# Hand-written in this repo: public lists for Roman Urdu are thin to absent
# (#44). Urdu written in Latin letters has no fixed spelling, so each entry
# lists the spellings a recogniser has been seen to choose between, under
# `roman`, and the Urdu-script forms under `script`. dsj matches these lists
# exactly, after folding case, punctuation and the Arabic-script letter
# variants (ي/ی, ك/ک, ه/ہ); it does not match by edit distance (dsj/hatao.py
# says why).
#
# Left out on purpose because their ordinary meaning is common: kutta, kutti
# (dog), suar (pig), ullu (owl), chod alone (a recogniser writes it for chhod,
# "leave"), gand alone (dirt, smell). Phrases cannot be entries, because
# matching is one word at a time; "bhen chod" written as two words is missed,
# "bhenchod" is not. Add your own words to your user file (`dsj hatao --help`
# names it), never here: an update replaces this file.

[[entry]]
name = "madarchod"
roman = ["madarchod", "maderchod", "madarchood", "madharchod", "maadarchod", "madarchodd",
         "madarchodo"]
script = ["مادرچود"]

[[entry]]
name = "behenchod"
roman = ["behenchod", "bhenchod", "benchod", "bhanchod", "behnchod", "bhainchod",
         "bainchod", "bhencho", "bencho", "bhenchodd", "behanchod"]
script = ["بہنچود", "بھنچود"]

